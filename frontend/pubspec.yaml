name: fairsplit
description: "FairSplit - Smart Expense Sharing"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # -------------------------
  # State Management
  # -------------------------
  flutter_riverpod: ^2.6.1

  # -------------------------
  # Navigation
  # -------------------------
  go_router: ^16.0.0

  # -------------------------
  # Networking
  # -------------------------
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0

  # -------------------------
  # Local Storage
  # -------------------------
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # -------------------------
  # Secure Storage
  # -------------------------
  flutter_secure_storage: ^9.2.4

  # -------------------------
  # Serialization
  # -------------------------
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # -------------------------
  # Utilities
  # -------------------------
  flutter_dotenv: ^6.0.0
  intl: ^0.20.2
  uuid: ^4.5.1
  connectivity_plus: ^7.0.0

  # -------------------------
  # UI
  # -------------------------
  google_fonts: ^6.3.1
  flutter_svg: ^2.2.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  gap: ^3.0.1
  flutter_animate: ^4.5.2
  lottie: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.6.0
  freezed: ^3.2.0
  json_serializable: ^6.11.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/lottie/